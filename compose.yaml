services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imobatlas}
      POSTGRES_USER: ${POSTGRES_USER:-imobatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env conforme .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-imobatlas}
      DB_USERNAME: ${POSTGRES_USER:-imobatlas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Crie o arquivo .env conforme .env.example}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"
volumes:
  postgres_data:
